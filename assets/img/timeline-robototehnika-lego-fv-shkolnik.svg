<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 1 Ч 30 МИН</text><line x1="158" y1="74" x2="158" y2="338" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:05</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Инструктаж, техника безопасности, выдача набора</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">проверить 158 элементов</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:05–0:15</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Разбор карты и сортировка деталей по блокам</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">лотки, маркер, резинка</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:15–0:50</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 1: основание, мотор, червячная передача, ремень</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">шаги карты 1–47</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:05</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 1: каретка, поворотный стол, держатель маркера</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">шаги карты 48–76</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:05–1:15</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 2: подключение коммутатора, программа «Чертежник»</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">порт 1, мощность 5</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:15–1:25</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Отладка фигуры на черновике</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">подбор длительностей</text><text x="136" y="346" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:25–1:30</text><circle cx="158" cy="341" r="6" fill="#007000"/><text x="180" y="346" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">ДЕМОНСТРАЦИЯ И СДАЧА</text><text x="180" y="366" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">чистовой лист, уборка</text><text x="40" y="404" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Через 1 ч 30 мин модель должна быть собрана, а фигура — начерчена.</text></svg>