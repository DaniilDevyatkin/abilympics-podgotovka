<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 426" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 2 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="338" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:15</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Этап 1: место, приёмка набора, мыльный раствор</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">15 г шерсти, шаблон 20×20 см, перчатки</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:15–0:45</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Этап 2: шаблон и первый слой с припуском</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">припуск 2–3 см, усадка около трети</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:45–1:10</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Этап 3: загнуть периметр, выложить второй слой</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">подложка полностью закрыта</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:10–1:40</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Этап 4: притирание через сетку, валяние в руках</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">усадка до 8–9 см, снять с шаблона</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:40–1:52</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Этап 5: полоскание, отжим, формовка, глазки 6 мм</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">клей только на подсохший войлок</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:52–2:00</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Этап 5: лента 3 мм, узел, осмотр, уборка</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">изделие на столе лицом к эксперту</text><text x="136" y="346" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">2:00</text><circle cx="158" cy="341" r="6" fill="#007000"/><text x="180" y="346" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="366" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">уведомить педагога до контрольного времени</text><text x="40" y="404" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">На всё задание отведено 2 часа; уборку места и уведомление педагога делают до сдачи.</text></svg>