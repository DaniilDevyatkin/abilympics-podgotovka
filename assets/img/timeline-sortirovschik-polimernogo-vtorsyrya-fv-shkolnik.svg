<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 338" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 1 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="250" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:15</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: организация места и приёмка сырья</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">7 вёдер 4–5 л · ориентировочно</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:15–0:45</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: сортировка по шести цветам</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">белые · синие · зелёные · жёлто-красные · коричневые · чёрные</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:45–0:52</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: пересыпание в мешки с маркировкой</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">по мере наполнения вёдер · ориентировочно</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:52–0:57</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: выборочная проверка и уборка</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">6 групп + «прочее» · стол и пол</text><text x="136" y="258" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">0:57–1:00</text><circle cx="158" cy="253" r="6" fill="#007000"/><text x="180" y="258" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="278" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">уведомить педагога · без этого работа не закончена</text><text x="40" y="316" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">КЗ даёт один час на всё задание; границы модулей внутри часа — ориентировочные.</text></svg>