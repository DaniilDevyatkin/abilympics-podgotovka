<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · ДО 25 МИН</text><line x1="158" y1="74" x2="158" y2="294" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–3:00</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Подготовка площадки: маты, инвентарь, проектор</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">до старта, ориентировочно</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:00–7:00</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Доклад: кто я и почему адаптивный кикбоксинг</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">по КЗ 3–5 мин</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">7:00–14:00</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Презентация до 10 слайдов и видео до 5 мин</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">по КЗ 7–10 мин</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">14:00–17:00</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Показ элемента и разбор судейских оценок</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">по КЗ 2–3 мин</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">17:00–24:00</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Тренировка: разминка, обучение, элемент</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">по КЗ 3–7 мин</text><text x="136" y="302" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">24:00–25:00</text><circle cx="158" cy="297" r="6" fill="#007000"/><text x="180" y="302" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА ПЛОЩАДКИ</text><text x="180" y="322" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">инвентарь и покрытие на местах</text><text x="40" y="360" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Окна этапов взяты из конкурсного задания; внутри этапа время не останавливают.</text></svg>