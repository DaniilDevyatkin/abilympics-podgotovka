<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПОДАЧА · ТАРЕЛКА 30–32 СМ</text><circle cx="186" cy="196" r="100" fill="#FFFFFF" stroke="#0540F2" stroke-width="3"/><circle cx="186" cy="196" r="74" fill="none" stroke="#0540F2" stroke-width="1.2" stroke-dasharray="6 6"/><text x="186" y="201" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle" letter-spacing="0">рабочее поле</text><line x1="186" y1="96" x2="186" y2="70" stroke="#0540F2" stroke-width="1.5"/><text x="186" y="64" font-size="14" fill="#0B1A26" font-weight="600" text-anchor="middle" letter-spacing="0">30–32 см</text><text x="330" y="100" font-size="17" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="0">Правила подачи</text><text x="330" y="132" font-size="15" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">— две одинаковые порции</text><text x="330" y="160" font-size="15" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">— декор тарелки запрещён</text><text x="330" y="188" font-size="15" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">— без шпажек и аксессуаров</text><text x="330" y="216" font-size="15" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">— край протёрт насухо</text><text x="330" y="244" font-size="15" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">— холодное: тарелка 1–14 °C</text><text x="330" y="272" font-size="15" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">— горячее: 45 °C и выше</text></svg>