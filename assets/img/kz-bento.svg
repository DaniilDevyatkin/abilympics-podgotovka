<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">СБОРКА БЕНТО-ТОРТА</text><rect x="60" y="96" width="230" height="30" fill="#e9e4d8" stroke="#0540F2" stroke-width="1.2"/><text x="72" y="119" font-size="15" fill="#0B1A26" font-weight="500" text-anchor="start" letter-spacing="0">хлеб</text><rect x="60" y="130" width="230" height="30" fill="#cfe6d5" stroke="#0540F2" stroke-width="1.2"/><text x="72" y="153" font-size="15" fill="#0B1A26" font-weight="500" text-anchor="start" letter-spacing="0">начинка</text><rect x="60" y="164" width="230" height="30" fill="#e9e4d8" stroke="#0540F2" stroke-width="1.2"/><text x="72" y="187" font-size="15" fill="#0B1A26" font-weight="500" text-anchor="start" letter-spacing="0">хлеб</text><rect x="60" y="198" width="230" height="30" fill="#cfe6d5" stroke="#0540F2" stroke-width="1.2"/><text x="72" y="221" font-size="15" fill="#0B1A26" font-weight="500" text-anchor="start" letter-spacing="0">начинка</text><rect x="60" y="232" width="230" height="30" fill="#e9e4d8" stroke="#0540F2" stroke-width="1.2"/><text x="72" y="255" font-size="15" fill="#0B1A26" font-weight="500" text-anchor="start" letter-spacing="0">хлеб</text><line x1="42" y1="96" x2="42" y2="266" stroke="#0540F2" stroke-width="2"/><text x="40" y="292" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">5 слоёв · высота изделия 4–5 см</text><text x="340" y="116" font-size="16" fill="#0B1A26" font-weight="600" text-anchor="start" letter-spacing="0">Кольцо снимаем</text><text x="340" y="138" font-size="16" fill="#0B1A26" font-weight="600" text-anchor="start" letter-spacing="0">после 20 минут</text><text x="340" y="160" font-size="16" fill="#0B1A26" font-weight="600" text-anchor="start" letter-spacing="0">в холодильнике</text><text x="340" y="206" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">На подаче 1–14 °C</text><text x="340" y="240" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Слои прижимаем ладонью:</text><text x="340" y="260" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">воздуха и начинки по краям</text><text x="340" y="280" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">быть не должно</text><text x="40" y="306" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Пять слоёв: хлеб → начинка → хлеб → начинка → хлеб.</text></svg>