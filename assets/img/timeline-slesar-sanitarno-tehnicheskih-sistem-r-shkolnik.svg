<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 558" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 1 Ч 30 МИН</text><line x1="158" y1="74" x2="158" y2="470" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:05</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Вход, СИЗ, приёмка инструмента</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">халат, перчатки, очки · 44 балла в модуле 1</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:05–0:15</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Распаковка смесителя, инструкция, сборка</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ключи 10 и 17 мм</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:15–0:25</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Монтаж на чашу: шланги в отверстие, шпилька</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">гайка крепления — ключ 11 мм</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:25–0:35</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Подключение к ГВС и ХВС, проверка на герметичность</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ключ 22 мм</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:35–0:40</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Устранение неисправности, замена регулятора струи</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">конец модуля 1</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:40–0:50</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Распаковка и сборка сифона</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">начало модуля 2 · 56 баллов</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:05</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Установка сифона, подключение к канализации, пролив</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">прямая отвёртка · уклон 2–4 см на метр</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:05–1:20</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Замена крана горячей воды</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">разводной ключ · лента 6–8 витков</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:20–1:26</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Замена кран-букс смесителя</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ключ 17 мм и крестовая отвёртка</text><text x="136" y="478" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:26–1:30</text><circle cx="158" cy="473" r="6" fill="#007000"/><text x="180" y="478" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Финальная проверка, уборка, СДАЧА РАБОТЫ</text><text x="180" y="498" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут</text><text x="40" y="536" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 1 — 40 минут, модуль 2 — 50 минут; опоздание к сдаче — работу не принимают.</text></svg>