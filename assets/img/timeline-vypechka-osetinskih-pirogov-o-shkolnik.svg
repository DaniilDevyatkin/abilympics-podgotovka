ont-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">ПОДАЧА №3 · ФЫДДЖЫН</text><text x="180" y="630" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">сервисное окно 3:05–3:10</text><text x="136" y="654" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:10–3:20</text><circle cx="158" cy="649" r="6" fill="#007000"/><text x="180" y="654" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Модуль А: уборка и сдача места</text><text x="180" y="674" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">вторые 10 минут модуля А</text><text x="40" y="712" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Подача после «Точки стоп» не оценивается: пирог не принимают вовсе.</text></svg>