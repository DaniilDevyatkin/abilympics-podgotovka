<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 734" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 5 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="646" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:15</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: обход стоянки, замер температуры</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">менее 60 °C — иначе ждём</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:15–0:30</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: сортовик, СИЗ, подготовка бороскопа</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">дата Д\М\Г, Ч\М на кадре</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:30–0:50</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: расстыковка узлов камеры сгорания</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">все отверстия — под заглушку</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:20</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: бороскоп — 12 позиций по кругу</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">камера сгорания и сопловой аппарат</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:20–1:30</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: ведомость дефектов, карта на работу, заключение</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">бланки без помарок</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:30–1:50</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: сборка, затяжка 5 и 10 Нм, контровка</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">новые прокладки, ВГО-1, «Резол»</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:50–2:00</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">СДАЧА МОДУЛЯ А</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ведомости и карта памяти эксперту</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:00–2:20</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: чертёж, расчёт развёртки, эскиз</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">полки, вычет на гиб, длина заклёпки</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:20–2:45</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: разметка, резка, опиливание</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">припуск 0,3–0,5 мм, R10, фаски</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:45–3:10</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: гибка и контроль углов</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">недогиб 2–3° на пружинение</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:10–3:40</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: отверстия, зенковка, контроль шага</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Ø3,0; зенковка 100°</text><text x="136" y="566" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:40–4:15</text><circle cx="158" cy="561" r="4" fill="#0540F2"/><text x="180" y="566" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: позиционирование пакета и клёпка</text><text x="180" y="586" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">головка 1,5d по АС 43-13-1в</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:15–4:50</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: доработка, уборка, раздельная утилизация</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">стружка — отдельно от ветоши</text><text x="136" y="654" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">4:50–5:00</text><circle cx="158" cy="649" r="6" fill="#007000"/><text x="180" y="654" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="674" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут</text><text x="40" y="712" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Опоздание к сдаче — работу не принимают. Модули идут в порядке жеребьёвки: 2 ч на А и 3 ч на Б.</text></svg>