r-spacing="0">готовность заявлена до старта</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:30–2:40</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: жеребьёвка притчи</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">одна из пяти, номер фиксируем</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:40–3:00</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Сюжетно-тематическая основа</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">эпизоды, зоны, маски персонажей</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:00–3:25</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Подбор жестов и репетиция притчи</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">диалоги и финальный жест</text><text x="136" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:25–3:30</text><circle cx="158" cy="561" r="6" fill="#007000"/><text x="180" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">ИСПОЛНЕНИЕ ПРИТЧИ</text><text x="180" y="586" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">финал — один жест и пауза</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:30–3:45</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: сверка песни с заданием</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">тема, хронометраж до 4 минут</text><text x="136" y="654" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:45–4:20</text><circle cx="158" cy="649" r="4" fill="#0540F2"/><text x="180" y="654" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Прогон песни целиком</text><text x="180" y="674" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">непрерывность, костюм и реквизит</text><text x="136" y="698" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">4:20–4:30</text><circle cx="158" cy="693" r="6" fill="#007000"/><text x="180" y="698" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">ИСПОЛНЕНИЕ И СДАЧА РАБОТЫ</text><text x="180" y="718" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">модуль закрыт, работа сдана</text><text x="40" y="756" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Всего 270 минут: А — 90, Б — 60, В — 60, Г — 60. За регламент в модуле Г дают 3 балла.</text></svg>