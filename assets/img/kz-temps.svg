<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ТЕМПЕРАТУРА ПОДАЧИ</text><line x1="60" y1="130" x2="620" y2="130" stroke="#0540F2" stroke-width="2"/><rect x="60" y="112" width="78" height="18" fill="#007000"/><rect x="312" y="112" width="308" height="18" fill="#0540F2"/><line x1="60" y1="106" x2="60" y2="138" stroke="#0540F2" stroke-width="1.5"/><text x="60.0" y="160" font-size="14" fill="#0B1A26" font-weight="400" text-anchor="middle" letter-spacing="0">0 °C</text><line x1="138" y1="106" x2="138" y2="138" stroke="#0540F2" stroke-width="1.5"/><text x="138.4" y="160" font-size="14" fill="#0B1A26" font-weight="400" text-anchor="middle" letter-spacing="0">14 °C</text><line x1="312" y1="106" x2="312" y2="138" stroke="#0540F2" stroke-width="1.5"/><text x="312.0" y="160" font-size="14" fill="#0B1A26" font-weight="400" text-anchor="middle" letter-spacing="0">45 °C</text><line x1="480" y1="106" x2="480" y2="138" stroke="#0540F2" stroke-width="1.5"/><text x="480.0" y="160" font-size="14" fill="#0B1A26" font-weight="400" text-anchor="middle" letter-spacing="0">75 °C</text><line x1="620" y1="106" x2="620" y2="138" stroke="#0540F2" stroke-width="1.5"/><text x="620.0" y="160" font-size="14" fill="#0B1A26" font-weight="400" text-anchor="middle" letter-spacing="0">100 °C</text><text x="40" y="208" font-size="16" fill="#007000" font-weight="600" text-anchor="start" letter-spacing="0">Холодные блюда и десерты: 1–14 °C</text><text x="40" y="236" font-size="16" fill="#0540F2" font-weight="600" text-anchor="start" letter-spacing="0">Горячие блюда: 45 °C и выше</text><text x="40" y="214" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Птица внутри — 72–75 °C. Тарелку эксперт измеряет пирометром.</text></svg>