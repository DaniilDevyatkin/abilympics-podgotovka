-spacing="0">медиазапросы, бургер-меню</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:15–3:40</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">JS: слайдер, модалки, карта, форма</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">авторотация и пауза по hover</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:40–3:55</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Chrome, Edge, Yandex + validator.w3.org</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">скриншоты в отчёт</text><text x="136" y="522" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:55–4:00</text><circle cx="158" cy="517" r="6" fill="#007000"/><text x="180" y="522" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="542" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут</text><text x="40" y="580" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Опоздание к сдаче — работу не принимают. Два часа на макеты, два на вёрстку.</text></svg>