ter-spacing="0">40 баллов · 1 ч 30 мин · припуск 1–1,5 мм</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:50–5:15</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Гнёзда под шканты, пропилы, подгонка всухую</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">сверло 8 мм, глубина 32 мм</text><text x="136" y="654" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">5:15–5:40</text><circle cx="158" cy="649" r="4" fill="#0540F2"/><text x="180" y="654" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Склейка каркаса и стяжки, установка столешницы</text><text x="180" y="674" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">диагонали ±2 мм, свесы ±1 мм</text><text x="136" y="698" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">5:40–5:55</text><circle cx="158" cy="693" r="4" fill="#0540F2"/><text x="180" y="698" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Контроль прочности, уборка места</text><text x="180" y="718" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">качание, нагрузка 10 кг, сколы</text><text x="136" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">5:55–6:00</text><circle cx="158" cy="737" r="6" fill="#007000"/><text x="180" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="762" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут</text><text x="40" y="800" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" lette