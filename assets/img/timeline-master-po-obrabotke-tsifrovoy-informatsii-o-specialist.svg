ter-spacing="0">имена строго по заданию</text><text x="136" y="1006" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:58–4:00</text><circle cx="158" cy="1001" r="6" fill="#007000"/><text x="180" y="1006" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="1026" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">опоздание — работу не принимают</text><text x="40" y="1064" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модули: А — 1 ч, Б — 40 мин, В — 1 ч, Г — 1 ч 20 мин.</text></svg>