<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 822" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 4 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="734" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:10</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: ограничения, эмоции, эпизод</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">эпизод уточнить у главного эксперта</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:10–0:25</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Герой и пять набросков атрибута</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">наброски 4×4 см, силуэтами</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:25–0:40</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Синопсис и название работы</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">3–5 предложений, 350–450 знаков</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:40–0:50</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Разметка листа: скетчи ≤30%, герой ≥40%</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">левый столбец 1450 px, лист 4961×3508</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:20</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Три скетча на заданные эмоции</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">полный рост, портрет, поясной</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:20–1:50</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Итоговый персонаж: каркас, поза, объём</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">габарит с атрибутом ≥40% листа</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:50–2:10</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Материалы, одежда, светотень</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">не меньше трёх разных материалов</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:10–2:20</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Атрибут и устранение дефектов</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">пальцы, контуры, точки контакта</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:20–2:30</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Текст на листе и сохранение «Модуль 1»</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">PDF/PNG 300 dpi + рабочий файл</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:30–2:40</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: слои и точки вращения</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">проект 1920×1080, 25 кадров в секунду</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:40–3:00</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Ключевые позы и тайминг</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">цикл 96 кадров = 3,84 секунды</text><text x="136" y="566" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:00–3:20</text><circle cx="158" cy="561" r="4" fill="#0540F2"/><text x="180" y="566" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Промежуточные кадры, дуги, атрибут</text><text x="180" y="586" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">отставание атрибута 2–3 кадра</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:20–3:35</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Эффекты и вторичные движения</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">борода, полы одежды, один-два эффекта</text><text x="136" y="654" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:35–3:45</text><circle cx="158" cy="649" r="4" fill="#0540F2"/><text x="180" y="654" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Замыкание цикла без склейки</text><text x="180" y="674" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">кадр 97 = кадр 1, в экспорт не идёт</text><text x="136" y="698" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:45–3:55</text><circle cx="158" cy="693" r="4" fill="#0540F2"/><text x="180" y="698" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Экспорт GIF/MPEG4 и проверка</text><text x="180" y="718" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">25 fps, не короче 75 кадров</text><text x="136" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:55–4:00</text><circle cx="158" cy="737" r="6" fill="#007000"/><text x="180" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="762" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут, папка под фамилией</text><text x="40" y="800" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">«Модуль 1» и «Модуль 2» плюс рабочие файлы — в папке под фамилией.</text></svg>