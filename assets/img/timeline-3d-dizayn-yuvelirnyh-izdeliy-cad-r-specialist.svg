<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 338" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 6 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="250" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–2:00</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 1: 3D-модель кольца по чертежу</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">36 баллов · проекции top, front, right</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:00–4:00</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 2: разделка под камни, облегчение, STL</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">34 балла · сетка 0,1 мм · 1 деталь = 1 файл</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:00–5:00</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 3: карта камней и спецификация</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">12 баллов · xlsx с суффиксом SPC</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">5:00–6:00</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль 4: литниковая система</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">18 баллов · задание меняют на 30 %</text><text x="136" y="258" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">5:55–6:00</text><circle cx="158" cy="253" r="6" fill="#007000"/><text x="180" y="258" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="278" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">общая папка 3DM / REF / STL</text><text x="40" y="316" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Перерывы по 10 минут после каждых 50 минут работы входят в общее время модулей.</text></svg>