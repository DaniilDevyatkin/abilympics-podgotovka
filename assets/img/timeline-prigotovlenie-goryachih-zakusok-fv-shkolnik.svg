<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 30 МИН</text><line x1="158" y1="74" x2="158" y2="294" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:05</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Подготовка: форма, руки, продукты, посуда, проверка печи</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">сверка набора до первого реза</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:05–0:13</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Нарезка: колбаса, сыр, батон</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ломтики 2–3 мм, парами</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:13–0:20</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Сборка: майонез 1 ч. л., 2 ломтика колбасы, 2 ломтика сыра</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">два бутерброда одинаковой высоты</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:20–0:25</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Запекание в микроволновой печи</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ровно 1 минута, у печи</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:25–0:28</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Подача порции: два горячих бутерброда</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">край тарелки протёрт</text><text x="136" y="302" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">0:28–0:30</text><circle cx="158" cy="297" r="6" fill="#007000"/><text x="180" y="302" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ И РАБОЧЕГО МЕСТА</text><text x="180" y="322" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">печь выключена, стол чист</text><text x="40" y="360" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Весь результат — одна порция из двух бутербродов, поданная в пределах 30 минут.</text></svg>