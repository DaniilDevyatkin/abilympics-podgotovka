<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 646" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 6 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="558" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:10</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Приёмка заготовок, СИЗ, читка чертежей</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">недостачу заявляем до старта</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:10–0:50</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: разметка и отрезка трубы</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">12 баллов · 500 и 200 мм</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:35</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: прихватка и сварка рамы</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">12 баллов · 4 угла по 3</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:35–2:40</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: плита, отверстия, резьба М10</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">24 балла · координаты ±0,5 мм</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:40–3:25</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: два вала на токарном станке</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">9 баллов · ф20 0/−0,05 мм</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:25–4:00</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Д: сборка и центровка муфты</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">17 баллов · щуп 0,1 мм</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:00–4:10</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Переход на пневмостенд, перерыв</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ориентировочно</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:10–4:50</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Е1: схема А+В+В−А− в FluidSIM</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">8 баллов · маркировка ISO 1219-2</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:50–5:10</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Вызов эксперта, печать и подпись схемы</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">без подписи к стенду не допускают</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">5:10–5:40</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Е2: монтаж на стенде, 5 ±0,5 бар</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">15 баллов · 3 попытки запуска</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">5:40–5:50</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Две неисправности эксперта: найти и устранить</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">4 балла · с показом причины</text><text x="136" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">5:50–6:00</text><circle cx="158" cy="561" r="6" fill="#007000"/><text x="180" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="586" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">стенд без давления, лист подписан</text><text x="40" y="624" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Внутри модуля 1 порядок блоков участник выбирает сам; модуль Е начинается только после подписания схемы.</text></svg>