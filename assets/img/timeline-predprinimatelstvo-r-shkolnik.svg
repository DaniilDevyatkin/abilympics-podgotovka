<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 822" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 3 Ч 30 МИН</text><line x1="158" y1="74" x2="158" y2="734" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:05</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Проверка рабочего места</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Excel или Word, шаблоны форм, имя файла</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:05–0:35</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: «Потребители и ключевые ценности»</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">5 критериев Котлера, 3 сегмента, потребитель ≠ покупатель</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:35–0:55</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: «Каналы сбыта»</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">5 этапов, прямой и косвенный уровень</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:55–1:10</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: «Взаимоотношения с клиентами»</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">тип отношений и ресурсы под него</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:10–1:18</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: «Потоки доходов»</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">монетизация, цены, 3 конкурента</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:18–1:20</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">СОХРАНЕНИЕ И СДАЧА ФОРМ МОДУЛЯ А</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">пять листов, эксперты читают до презентации</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:20–1:45</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: «Ключевые ресурсы»</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">количество и цена по каждой строке</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:45–2:05</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: «Ключевые виды деятельности»</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ИП на УСН, сроки запуска, процессы</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:05–2:20</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: «Ключевые партнёры»</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">партнёр — ресурс — процесс</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:20–2:38</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: «Структура издержек»</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">план продаж, прибыль, безубыточность, инвестиции</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:38–2:40</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">СОХРАНЕНИЕ И СДАЧА ФОРМ МОДУЛЯ Б</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">сверка пяти пар чисел между листами</text><text x="136" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">2:40–2:45</text><circle cx="158" cy="561" r="6" fill="#007000"/><text x="180" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Модуль В: ПРЕЗЕНТАЦИЯ БИЗНЕС-МОДЕЛИ</text><text x="180" y="586" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">не более 5 минут, дальше выступление останавливают</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:45–2:47</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Вопросы экспертов</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">не более 2 минут на участника</text><text x="136" y="654" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:47–3:00</text><circle cx="158" cy="649" r="4" fill="#0540F2"/><text x="180" y="654" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Резерв модуля В</text><text x="180" y="674" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">окно 20 минут на всех участников</text><text x="136" y="698" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:00–3:25</text><circle cx="158" cy="693" r="4" fill="#0540F2"/><text x="180" y="698" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: региональное задание</text><text x="180" y="718" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">рынок района, социальный проект или новый продукт</text><text x="136" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:25–3:30</text><circle cx="158" cy="737" r="6" fill="#007000"/><text x="180" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="762" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут</text><text x="40" y="800" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">За регламентом выступление останавливают, а материалы, подготовленные до конкурса, использовать нельзя.</text></svg>