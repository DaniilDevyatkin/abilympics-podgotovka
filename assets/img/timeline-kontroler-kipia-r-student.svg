<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 866" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 1 Ч 20 МИН</text><line x1="158" y1="74" x2="158" y2="778" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:03</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Приёмка стенда, осмотр приборов, проверка нуля</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">вентили закрыты, редуктор на нуле</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:03–0:07</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Паспортные данные в протокол, три цены деления</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">0,01 · 0,01 · 0,005 МПа</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:07–0:11</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Сборка схемы проверки первого прибора</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">эталон и рабочий на одном тройнике</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:11–0:14</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Опрессовка до 1,0 МПа, обмыливание соединений</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">выдержка 5 минут</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:14–0:19</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Первый прибор: прямой ход, 5 точек</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">0; 0,25; 0,50; 0,75; 1,00 МПа</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:19–0:23</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Первый прибор: обратный ход, 5 точек</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">снижение только редуктором</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:23–0:28</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Погрешности, протокол №1, вывод</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">допуск 0,015 МПа</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:28–0:31</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Смена прибора на второй, проверка герметичности</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">диапазон 0–1,6 МПа</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:31–0:36</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Второй прибор: прямой и обратный ход</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">0; 0,4; 0,8; 1,2; 1,6 МПа</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:36–0:39</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Погрешности, протокол №2, вывод по двум приборам</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">допуск 0,016 МПа</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:39–0:40</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Разбор пневмосхемы, стенд без давления</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А закрыт</text><text x="136" y="566" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:40–0:45</text><circle cx="158" cy="561" r="4" fill="#0540F2"/><text x="180" y="566" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: схема с калибратором</text><text x="180" y="586" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ТСМ 50М, трёхпроводно</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:45–0:50</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Ввод НСХ в калибратор, контрольные точки</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">50,00 и 71,40 Ом</text><text x="136" y="654" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–0:57</text><circle cx="158" cy="649" r="4" fill="#0540F2"/><text x="180" y="654" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Три точки: 0; 50; 100 °C</text><text x="180" y="674" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">R0 50,00 · W100 1,428</text><text x="136" y="698" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:57–1:02</text><circle cx="158" cy="693" r="4" fill="#0540F2"/><text x="180" y="698" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Протокол, погрешность в градусах, вывод</text><text x="180" y="718" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">допуск ±(0,3+0,005|t|)</text><text x="136" y="742" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:02–1:05</text><circle cx="158" cy="737" r="4" fill="#0540F2"/><text x="180" y="742" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Разбор схемы, порядок, сдача работы</text><text x="180" y="762" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">5 баллов за порядок</text><text x="136" y="786" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:05–1:20</text><circle cx="158" cy="781" r="6" fill="#007000"/><text x="180" y="786" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">РЕЗЕРВ · сдача до 1:05</text><text x="180" y="806" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">досрочность · 5 баллов</text><text x="40" y="844" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Сдача позже 1:20 — работу не принимают. Запас 15 минут даёт 5 баллов в модуле Б.</text></svg>