<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 646" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 2 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="558" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:15</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Организация места: оснастка, СИЗ, зоны</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">свет слева, посадка 35–40 см</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:15–0:25</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Партия №1: вода 40 % и гипс 60 %</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">весы, тара, до грамма</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:25–0:33</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Замес без комков, снятие пены</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">раствор стекает лентой</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:33–0:40</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Заливка подноса, простукивание молда</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">тонкая струя в одну точку</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:40–1:00</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Застывание подноса · 20 минут</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">форму не двигать; в окне отвешиваем партию №2</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:00–1:08</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Заливка вазы в два приёма</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">узкая ножка заполнена, рельеф лица</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:08–1:16</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Распалубка подноса, осмотр</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">кромка целая, борт не сорван</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:16–1:26</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Шкурка дна подноса, снятие пыли</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">наждачка 100 мкм, лист на ровной подложке</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:26–1:34</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Лак подноса, первый слой</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">тонко, в одном направлении</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:34–1:42</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Распалубка вазы, осмотр</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">не тянуть за ножку и голову</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:42–1:50</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Шкурка дна вазы, лак вазы</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">пыль снимаем сухой кистью</text><text x="136" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:50–2:00</text><circle cx="158" cy="561" r="6" fill="#007000"/><text x="180" y="566" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="586" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут, изделия на подложке</text><text x="40" y="624" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Застывание 20 минут сокращать нельзя: недодержанное изделие мнётся при распалубке.</text></svg>