<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 338" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 3 Ч 30 МИН</text><line x1="158" y1="74" x2="158" y2="250" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:30</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: папки, проект «Escape the Dungeon», ресурсы</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">30 мин · Scripts, Audio, Sprite + сцены в Build Settings</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:30–1:30</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: главный экран, экраны победы и поражения</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">60 мин · «Старт», «Выход», «Ты выиграл», «Ты проиграл»</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:30–3:00</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: уровень, движение, прыжок, шипы, портал, звук</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">90 мин · сцена Level1, 3 платформы, 1 портал, шаги и музыка</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:00–3:25</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: прогон по чек-листу, правки и билд</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">25 мин · сборка в папку Build и запуск exe</text><text x="136" y="258" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:25–3:30</text><circle cx="158" cy="253" r="6" fill="#007000"/><text x="180" y="258" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="278" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">проект сохранён, папки Project и Build на месте</text><text x="40" y="316" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Все модули — 3 ч 30 мин по конкурсному заданию; после 3:30 работу не принимают.</text></svg>