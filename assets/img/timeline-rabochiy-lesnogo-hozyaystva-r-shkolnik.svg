<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 294" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 1 Ч 30 МИН</text><line x1="158" y1="74" x2="158" y2="206" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:25</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: теория и бланк</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">25 мин по КЗ · семена, древесина, машины</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:25–1:05</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: разбор образцов</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">40 мин по КЗ · шишки, семена, побеги, пороки</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:05–1:27</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: региональный компонент</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">25 мин по КЗ · породы, ООПТ, план лесонасаждения</text><text x="136" y="214" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:27–1:30</text><circle cx="158" cy="209" r="6" fill="#007000"/><text x="180" y="214" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="234" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">бланки А–В и наборы · окно ±3 минуты</text><text x="40" y="272" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Время модулей по КЗ: 25 + 40 + 25 минут. Опоздание к сдаче — работу не принимают.</text></svg>