<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 50 МИН</text><line x1="158" y1="74" x2="158" y2="162" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:25</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: классический гигиенический массаж</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">50 баллов · крестец–затылок, до средней аксиллярной линии</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:25–0:50</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: свободная программа из заявки</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">50 баллов · время могут изменить на ±5 минут</text><text x="136" y="170" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">0:50</text><circle cx="158" cy="165" r="6" fill="#007000"/><text x="180" y="170" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="190" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">модель остаётся на столе, рука вверх</text><text x="40" y="228" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Опрос модели и подготовка места — за 10 минут до старта, вне конкурсного времени.</text></svg>