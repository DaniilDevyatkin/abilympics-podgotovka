<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 1 Ч 30 МИН</text><line x1="158" y1="74" x2="158" y2="426" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:10</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: спецодежда, разворот места, мытьё кассеты</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">12 ячеек, дренаж открыт</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:10–0:20</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: почвосмесь, заполнение и полив кассеты</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">комки до 5 мм, «комок держится»</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:20–0:50</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: пикировка 12 сеянцев</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">2–2,5 мин на растение, по центру ячейки</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:00</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: полив, рассадный шкаф, уборка</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">конец модуля А · 40 баллов</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:00–1:08</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: горшок +1–2 см, дренаж 1–1,5 см, смесь</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">сырьё — 10 баллов</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:08–1:14</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: полив и выемка растения с комом</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ком не разрушать</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:14–1:22</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: установка по центру, засыпка, обжатие</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">до бортика 2–2,5 см</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:22–1:27</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: полив, досыпка, демонстрационный стол</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">горшок протереть насухо</text><text x="136" y="434" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:27–1:30</text><circle cx="158" cy="429" r="6" fill="#007000"/><text x="180" y="434" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="454" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут</text><text x="40" y="492" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А — 1 час, модуль Б — 30 минут. Опоздание к сдаче — работу не принимают.</text></svg>