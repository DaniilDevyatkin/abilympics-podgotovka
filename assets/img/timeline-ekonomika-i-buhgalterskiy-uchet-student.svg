<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 3 Ч 45 МИН</text><line x1="158" y1="74" x2="158" y2="602" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:10</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Старт: проверка базы, реквизиты, папка участника</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">резерв времени до модуля А</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:10–0:50</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: раскройный комплекс и материалы</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">счета 08, 01, 10, 19, 60</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:50–1:10</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: подотчётные суммы и авансовый отчёт</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">счёт 71, счёт 26</text><text x="136" y="214" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:10–1:25</text><circle cx="158" cy="209" r="6" fill="#007000"/><text x="180" y="214" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Модуль А: выпуск, аренда, три регистра</text><text x="180" y="234" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">контрольная точка 1:25</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:25–1:45</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: аванс за первую половину марта</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">счета 70, 68.01, 69</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:45–1:55</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: инвентаризация и недостача</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">счета 94, 73.2</text><text x="136" y="346" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:55–2:10</text><circle cx="158" cy="341" r="6" fill="#007000"/><text x="180" y="346" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Модуль Б: зарплата за март, закрытие месяца, ведомость БУ и НУ</text><text x="180" y="366" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">контрольная точка 2:10</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:10–2:25</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: уведомления по ЕНС</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">КНД 1110355, срок 25.04</text><text x="136" y="434" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">2:25–2:40</text><circle cx="158" cy="429" r="6" fill="#007000"/><text x="180" y="434" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Модуль В: платёжные поручения и 6-НДФЛ</text><text x="180" y="454" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">контрольная точка 2:40</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:40–3:10</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: упрощённый баланс ООО «СтройИнвестФинанс»</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">ОКУД 0710001, тыс. руб.</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:10–3:30</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: аналитические таблицы по балансу и ОФР</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">структура, динамика, темпы прироста</text><text x="136" y="566" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:30–3:40</text><circle cx="158" cy="561" r="4" fill="#0540F2"/><text x="180" y="566" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: графики и текст выводов</text><text x="180" y="586" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">две диаграммы</text><text x="136" y="610" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:40–3:45</text><circle cx="158" cy="605" r="6" fill="#007000"/><text x="180" y="610" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="630" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут, все папки модулей</text><text x="40" y="668" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Опоздание к сдаче — работу не принимают. Папки «Модуль А»–«Модуль Г» сдаются вместе.</text></svg>