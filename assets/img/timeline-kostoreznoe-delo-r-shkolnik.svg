<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 822" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 5 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="734" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:12</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А: приёмка места, свет, инструмент</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">заготовка, лобзик, 3 пилки</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:12–0:45</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Разметка циркулем и карандашом</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">осевая, засечки, припуск 1 мм</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:45–1:35</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Выпиливание контура лобзиком</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">поворот заготовки, не лобзика</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:35–1:50</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Внутренние вырезы и отверстие под шнур</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">через просверленное отверстие</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:50–2:00</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Шлифовка кромки, фаска, контроль формы</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модуль А сдан · 30 баллов</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:00–2:08</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б: обезжиривание, калька, шаблон</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">красящий слой — к изделию</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:08–2:22</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Прикатка и снятие кальки</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">от центра к периферии</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:22–2:30</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Фиксация линий, чистка фона</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Б сдан · 6 баллов</text><text x="136" y="434" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:30–2:45</text><circle cx="158" cy="429" r="4" fill="#0540F2"/><text x="180" y="434" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В: настройка бора, проба на обрезке</text><text x="180" y="454" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">10–15 тыс. об/мин</text><text x="136" y="478" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:45–3:35</text><circle cx="158" cy="473" r="4" fill="#0540F2"/><text x="180" y="478" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Гравировка контура орнамента</text><text x="180" y="498" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">глубина 0,3–0,5 мм</text><text x="136" y="522" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:35–4:00</text><circle cx="158" cy="517" r="4" fill="#0540F2"/><text x="180" y="522" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Внутренние элементы, снятие заусенцев</text><text x="180" y="542" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">одинаковый шаг, ритм</text><text x="136" y="566" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:00–4:20</text><circle cx="158" cy="561" r="4" fill="#0540F2"/><text x="180" y="566" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Тонировка линий кофейным раствором</text><text x="180" y="586" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">2 слоя, сушка без фена</text><text x="136" y="610" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:20–4:30</text><circle cx="158" cy="605" r="4" fill="#0540F2"/><text x="180" y="610" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Контроль полноты рисунка по образцу</text><text x="180" y="630" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Модуль В сдан · 42 балла</text><text x="136" y="654" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:30–4:44</text><circle cx="158" cy="649" r="4" fill="#0540F2"/><text x="180" y="654" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Модуль Г: шлифовка 800–1500, обезжиривание</text><text x="180" y="674" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">до однородной матовости</text><text x="136" y="698" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">4:44–4:55</text><circle cx="158" cy="693" r="4" fill="#0540F2"/><text x="180" y="698" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Полировка пастой и диском, чистка канавок</text><text x="180" y="718" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">без перегрева кромки</text><text x="136" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">4:55–5:00</text><circle cx="158" cy="737" r="6" fill="#007000"/><text x="180" y="742" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="762" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">окно ±5 минут · Модуль Г · 22 балла</text><text x="40" y="800" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">Опоздание к сдаче — работу не принимают к оценке. Всего 100 баллов за 5 часов.</text></svg>