<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 4 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="426" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:40</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Обход станка, чертёж с изменением 30 %, план и карта инструмента</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">СИЗ, конус шпинделя, список размеров и установов</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:40–1:40</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Управляющая программа в CAD/CAM</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">модель, заготовка с припуском 0,3–0,5 мм, черновая и чистовая</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:40–2:10</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Сборка инструмента, биение до 0,02 мм, магазин и коррекции</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">вылет по карте, H = T, проверка вызова</text><text x="136" y="214" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:10–2:35</text><circle cx="158" cy="209" r="4" fill="#0540F2"/><text x="180" y="214" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Заготовка в тисках, выверка, привязка G54 и длин</text><text x="180" y="234" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">перекос до 0,03 мм, пробная стружка 0,1–0,2 мм</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">2:35–3:00</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Пробный запуск на 30–50 % подачи и черновая</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">первый размер мерим сразу, подналадка по корректору</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:00–3:25</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Чистовая: контур, карманы, отверстия и фаски</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">шаг 0,3–0,5 мм, шероховатость по чертежу</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:25–3:40</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Заусенцы и контроль: 44 + 22 балла за размеры</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">протокол отклонений на листе</text><text x="136" y="390" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">3:40–3:55</text><circle cx="158" cy="385" r="4" fill="#0540F2"/><text x="180" y="390" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Резерв на исправление и уборка места</text><text x="180" y="410" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">стружка, инструмент, ключи, СОЖ</text><text x="136" y="434" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">3:55–4:00</text><circle cx="158" cy="429" r="6" fill="#007000"/><text x="180" y="434" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">СДАЧА РАБОТЫ</text><text x="180" y="454" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">деталь, чертёж и лист измерений · после 4:00 не принимают</text><text x="40" y="492" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">240 минут одним модулем А: основные размеры 44, второстепенные 22, шероховатость 8, элементы 10, качество работы 16.</text></svg>