<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="Jost, Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="46" font-size="20" fill="#0540F2" font-weight="700" text-anchor="start" letter-spacing="1">ПЛАН КОНКУРСА · 2 Ч 00 МИН</text><line x1="158" y1="74" x2="158" y2="382" stroke="#0540F2" stroke-width="2"/><text x="136" y="82" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:00–0:05</text><circle cx="158" cy="77" r="4" fill="#0540F2"/><text x="180" y="82" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Инструктаж, осмотр места, проверка инструмента</text><text x="180" y="102" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">очки, перчатки, пинцет, кусачки</text><text x="136" y="126" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:05–0:20</text><circle cx="158" cy="121" r="4" fill="#0540F2"/><text x="180" y="126" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Основа: заготовка, шаблон, оклейка рамки скотчем</text><text x="180" y="146" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">около 15 минут</text><text x="136" y="170" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">0:20–0:40</text><circle cx="158" cy="165" r="4" fill="#0540F2"/><text x="180" y="170" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Разбор и наколка мозаики на квадраты</text><text x="180" y="190" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">60 плиток, сортировка по цвету и размеру</text><text x="136" y="214" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">0:40–1:25</text><circle cx="158" cy="209" r="6" fill="#007000"/><text x="180" y="214" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Выкладка: небо, лес, море, парусники</text><text x="180" y="234" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">контроль: небо и лес готовы к 1:00</text><text x="136" y="258" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:25–1:35</text><circle cx="158" cy="253" r="4" fill="#0540F2"/><text x="180" y="258" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Проверка швов и геометрии по линейке</text><text x="180" y="278" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">правка до затирки</text><text x="136" y="302" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:35–1:42</text><circle cx="158" cy="297" r="4" fill="#0540F2"/><text x="180" y="302" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Приклеивание на основу и затирка</text><text x="180" y="322" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">клеит преподаватель, затирает участник</text><text x="136" y="346" font-size="16" fill="#5b6472" font-weight="700" text-anchor="end" letter-spacing="0">1:42–1:52</text><circle cx="158" cy="341" r="4" fill="#0540F2"/><text x="180" y="346" font-size="16" fill="#0B1A26" font-weight="400" text-anchor="start" letter-spacing="0">Выдержка 7–10 минут, снятие остатков и скотча</text><text x="180" y="366" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">влажные салфетки</text><text x="136" y="390" font-size="16" fill="#007000" font-weight="700" text-anchor="end" letter-spacing="0">1:52–2:00</text><circle cx="158" cy="385" r="6" fill="#007000"/><text x="180" y="390" font-size="16" fill="#007000" font-weight="700" text-anchor="start" letter-spacing="0">Оформление, уборка, СДАЧА РАБОТЫ</text><text x="180" y="410" font-size="14" fill="#007000" font-weight="400" text-anchor="start" letter-spacing="0">уведомить педагога до 2:00</text><text x="40" y="448" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start" letter-spacing="0">На всё задание — 2 часа. Работа сдаётся до окончания времени; опоздание к сдаче — работу не принимают.</text></svg>