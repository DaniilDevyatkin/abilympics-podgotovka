# Кэш ответов домашнего сервера на диске VDS.
# Файлы остаются дома: здесь только копии, которые nginx делает сам при первом
# обращении и обновляет по ETag. Потеря VDS = потеря копий, но не файлов.
proxy_cache_path /var/cache/nginx/abilympics
                 levels=1:2
                 keys_zone=abilympics:32m
                 max_size=2g
                 inactive=7d
                 use_temp_path=off;
