# Сайт «Абилимпикс Башкортостан» — приём трафика на VDS и передача в туннель.
# Сжатие делает serve.py на домашней машине, поэтому здесь gzip off.

# Переиспользование соединений к туннелю: без keepalive nginx открывает новое
# TCP-соединение (а значит и новый канал SSH) на каждый запрос. На канале с
# потерями это лишние RTT и постоянный медленный старт на каждой картинке.
#
# Основной путь — frp поверх KCP (UDP), порт 18100: нет TCP-в-TCP, поэтому
# потери на маршруте ufanet -> dataix не душат соединение. Если frp недоступен,
# nginx уходит на резервный SSH-туннель (18099).
upstream abilympics_tunnel {
    server 127.0.0.1:18100 max_fails=1 fail_timeout=20s;
    server 127.0.0.1:18099 backup;
    keepalive 64;
}

# Блок 1: доступ по голому IP (без TLS — на IP сертификат не выпускается).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 104.128.130.176 _;

    gzip off;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log abilimpics;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://abilympics_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- кэш на диске VDS ---
        proxy_cache abilympics;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # HTML: короткий кэш. serve.py отдаёт no-cache (чтобы правки доезжали
        # сразу), но для страницы важнее пережить сбой туннеля, поэтому
        # игнорируем этот заголовок и держим копию 2 минуты.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 2m;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_age 30s;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        # Быстрый отказ: если основной путь не отвечает, nginx сразу пробует
        # резервный SSH-туннель, а не ждёт 300 секунд.
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_socket_keepalive on;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# Блок 2: доступ по имени с сертификатом.
server {
    server_name 104.128.130.176.sslip.io abilympics-podgotovka.skoiptforma.ru;

    gzip off;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log abilimpics;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Статика (картинки, css, шрифты) — кэш на сутки: serve.py отдаёт
    # для них Cache-Control max-age=86400.
    location /assets/ {
        proxy_pass http://abilympics_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache abilympics;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 1d;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
    }

    # PDF (807 МБ) кэшируем кусками по 1 МБ: посетитель получает первые
    # мегабайты сразу, остальное оседает в кэше по мере чтения.
    location /assets/docs/ {
        proxy_pass http://abilympics_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache abilympics;
        proxy_cache_key "$scheme$request_method$host$request_uri$slice_range";
        proxy_cache_valid 200 206 1h;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        proxy_pass http://abilympics_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- кэш на диске VDS ---
        proxy_cache abilympics;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # HTML: короткий кэш. serve.py отдаёт no-cache (чтобы правки доезжали
        # сразу), но для страницы важнее пережить сбой туннеля, поэтому
        # игнорируем этот заголовок и держим копию 2 минуты.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 2m;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_age 30s;
        proxy_cache_lock_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_socket_keepalive on;
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/104.128.130.176.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/104.128.130.176.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = 104.128.130.176.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = abilympics-podgotovka.skoiptforma.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 104.128.130.176.sslip.io abilympics-podgotovka.skoiptforma.ru;
    return 404; # managed by Certbot



}
