# Сайт «Абилимпикс Башкортостан» — приём трафика на VDS и передача в туннель.
# Сжатие делает serve.py на домашней машине, поэтому здесь gzip off.

# Блок 1: доступ по голому IP (без TLS — на IP сертификат не выпускается).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 104.128.130.176 _;

    gzip off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:18099;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF по 5-7 МБ идут через домашний канал: запас по таймаутам
        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Блок 2: доступ по имени с сертификатом. Сюда certbot добавит 443 и редирект.
# Когда появится настоящий домен, его имя вписывается в server_name рядом
# с временным, и сертификат перевыпускается на оба имени.
server {
    listen 80;
    listen [::]:80;
    server_name 104.128.130.176.sslip.io abilympics-podgotovka.skoiptforma.ru;

    gzip off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:18099;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 16 128k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
