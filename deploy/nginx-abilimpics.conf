# Вариант A (рекомендую): Caddy — сертификат Let's Encrypt сам, две строки конфига.
# /etc/caddy/Caddyfile
#
# abilimpics.example.ru {
#     encode zstd gzip
#     reverse_proxy 127.0.0.1:18099
# }
#
# Вариант B: nginx + certbot. Ниже полный конфиг.
# /etc/nginx/sites-available/abilimpics.conf
#
# Внимание: сжатие делает наш собственный сервер (serve.py), поэтому здесь
# gzip выключен — иначе получится двойное сжатие и битые файлы у клиента.

upstream abilimpics_local {
    server 127.0.0.1:18099;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name abilimpics.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abilimpics.example.ru;

    ssl_certificate     /etc/letsencrypt/live/abilimpics.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abilimpics.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    gzip off;                 # сжимает serve.py, не дублировать
    client_max_body_size 1m;  # сайт только читают, загрузок нет

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://abilimpics_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF по 5-7 МБ через домашний канал: даём запас по таймаутам
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
